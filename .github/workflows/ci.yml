name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  tests:
    name: pytest (tests/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pytest
        run: |
          set -euo pipefail
          python3 -m pip install -U pytest

      - name: Run test suite
        run: |
          set -euo pipefail
          python3 -m pytest tests/ -q

  lint:
    name: skill lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run skill lint
        run: |
          set -euo pipefail
          python3 scripts/skill_lint.py .

  script-smoke:
    name: Script Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Smoke CLI entrypoints
        run: |
          set -euo pipefail
          python3 scripts/cangjie.py --help >/dev/null
          python3 scripts/audit_summary.py --help >/dev/null
          python3 scripts/validate_video_script.py --help >/dev/null
          echo "Smoke passed."
