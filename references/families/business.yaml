# Business Family -- Reporting, risks, action tracking
# Covers: project status, weekly/monthly reports, executive briefs, risk/issue reports, action tracking
# Output skeleton: guides/skeletons-business.md

family: business
description: Status reporting, progress tracking
default_template: business/project-status-report
skeleton_file: guides/skeletons-business.md

templates:
  - id: business/project-status-report
    name: Project Status Report
  - id: business/weekly-monthly-report
    name: Weekly/Monthly Report
  - id: business/executive-brief
    name: Executive Brief
  - id: business/risk-issue-report
    name: Risk/Issue Report
  - id: business/action-tracker
    name: Action Tracker

selection_rules:
  - condition: "Focus is milestone progress and metrics"
    template: business/project-status-report
  - condition: "Focus is weekly/monthly regular sync"
    template: business/weekly-monthly-report
  - condition: "Focus is upward reporting"
    template: business/executive-brief
  - condition: "Focus is incident/issues"
    template: business/risk-issue-report
  - condition: "Focus is action tracking"
    template: business/action-tracker
  - condition: "Uncertain sub-type"
    template: business/project-status-report
