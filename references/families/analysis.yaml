# Analysis family — Research synthesis, decision support, paper reading
# Covers: Research briefs, paper summaries (with 5 subtypes), decision memos, theme synthesis, competitive scans
# Output skeleton: guides/skeletons-analysis.md

family: analysis
description: Multi-source synthesis, decision support, paper reading
default_template: analysis/research-brief
skeleton_file: guides/skeletons-analysis.md

templates:
  - id: analysis/research-brief
    name: Research Brief
  - id: analysis/paper-summary
    name: Paper Summary (General)
    notes: When a paper subtype is identified, prefer the corresponding subtype template
  - id: analysis/theoretical-paper-summary
    name: Theoretical Paper Summary
  - id: analysis/experimental-paper-summary
    name: Experimental Paper Summary
  - id: analysis/systems-paper-summary
    name: Systems Paper Summary
  - id: analysis/survey-paper-summary
    name: Survey Paper Summary
  - id: analysis/decision-memo
    name: Decision Memo
  - id: analysis/theme-synthesis
    name: Theme Synthesis
  - id: analysis/competitive-scan
    name: Competitive Scan (Lightweight)
    notes: For product-decision-oriented full competitive analysis, use product/competitive-analysis

selection_rules:
  - condition: "Goal is understanding a single paper"
    template: analysis/paper-summary
  - condition: "Theorems/proofs/formula derivations"
    template: analysis/theoretical-paper-summary
  - condition: "Datasets/metrics/experimental comparisons"
    template: analysis/experimental-paper-summary
  - condition: "System architecture/throughput/latency"
    template: analysis/systems-paper-summary
  - condition: "Literature survey/taxonomy"
    template: analysis/survey-paper-summary
  - condition: "Focus is making a choice"
    template: analysis/decision-memo
  - condition: "Focus is common themes"
    template: analysis/theme-synthesis
  - condition: "Lightweight peer comparison"
    template: analysis/competitive-scan
  - condition: "Focus is industry and fact scanning"
    template: analysis/research-brief
  - condition: "Uncertain subtype"
    template: analysis/research-brief
