# Analysis 族 — 研究归纳、决策支持、论文阅读
# 覆盖：研究简报、论文总结（含 5 个子类型）、决策备忘录、主题综合、竞品扫描
# 输出骨架：guides/skeletons-analysis.md

family: analysis
description: 多源归纳、决策支持、论文阅读
default_template: analysis/research-brief
skeleton_file: guides/skeletons-analysis.md

templates:
  - id: analysis/research-brief
    name: 研究简报
  - id: analysis/paper-summary
    name: 论文总结（通用）
    notes: 当识别出论文子类型时，优先使用对应子类型模板
  - id: analysis/theoretical-paper-summary
    name: 理论论文总结
  - id: analysis/experimental-paper-summary
    name: 实验论文总结
  - id: analysis/systems-paper-summary
    name: 系统论文总结
  - id: analysis/survey-paper-summary
    name: 综述论文总结
  - id: analysis/decision-memo
    name: 决策备忘录
  - id: analysis/theme-synthesis
    name: 主题综合
  - id: analysis/competitive-scan
    name: 竞品扫描（轻量级）
    notes: 面向产品决策的完整竞品分析请使用 product/competitive-analysis

selection_rules:
  - condition: "目标是读懂单篇论文"
    template: analysis/paper-summary
  - condition: "定理/证明/公式推导"
    template: analysis/theoretical-paper-summary
  - condition: "数据集/指标/实验对比"
    template: analysis/experimental-paper-summary
  - condition: "系统架构/吞吐延迟"
    template: analysis/systems-paper-summary
  - condition: "文献综述/taxonomy"
    template: analysis/survey-paper-summary
  - condition: "重点是做选择"
    template: analysis/decision-memo
  - condition: "重点是共性主题"
    template: analysis/theme-synthesis
  - condition: "轻量级同类对比"
    template: analysis/competitive-scan
  - condition: "重点是行业和事实扫描"
    template: analysis/research-brief
  - condition: "不确定子类型"
    template: analysis/research-brief
