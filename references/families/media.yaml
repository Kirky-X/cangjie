# Media family — Program review, highlight distribution
# Covers: Podcasts/interviews, video programs, livestream recaps, content highlights extraction
# Output skeleton: guides/skeletons-media.md

family: media
description: Program review, highlight distribution
default_template: media/podcast-summary
skeleton_file: guides/skeletons-media.md

templates:
  - id: media/podcast-summary
    name: Podcast/Interview Summary
  - id: media/video-program-summary
    name: Video Program Summary
  - id: media/livestream-recap
    name: Livestream Recap
  - id: media/content-highlights
    name: Content Highlights Extraction

selection_rules:
  - condition: "Podcast/interview audio"
    template: media/podcast-summary
  - condition: "Video program"
    template: media/video-program-summary
  - condition: "Livestream recap"
    template: media/livestream-recap
  - condition: "Extracting highlight clips"
    template: media/content-highlights
  - condition: "Uncertain subtype"
    template: media/podcast-summary
