# Media 族 — 节目回顾、亮点传播
# 覆盖：播客/访谈、视频节目、直播回顾、内容亮点提炼
# 输出骨架：guides/skeletons-media.md

family: media
description: 节目回顾、亮点传播
default_template: media/podcast-summary
skeleton_file: guides/skeletons-media.md

templates:
  - id: media/podcast-summary
    name: 播客/访谈摘要
  - id: media/video-program-summary
    name: 视频节目摘要
  - id: media/livestream-recap
    name: 直播回顾
  - id: media/content-highlights
    name: 内容亮点提炼

selection_rules:
  - condition: "播客/访谈音频"
    template: media/podcast-summary
  - condition: "视频节目"
    template: media/video-program-summary
  - condition: "直播回顾"
    template: media/livestream-recap
  - condition: "提炼精彩片段"
    template: media/content-highlights
  - condition: "不确定子类型"
    template: media/podcast-summary
