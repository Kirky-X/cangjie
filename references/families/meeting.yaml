# Meeting Family -- Minutes, interviews, co-creation records
# Covers: decision minutes, discussion minutes, interview records, 1:1 communication, workshop summaries
# Output skeleton: guides/skeletons-meeting.md
# Note: For formal archiving (with ACTION numbers/Parking Lot/FAR principle), use product/meeting-minutes-detailed

family: meeting
description: Discussion records, responsibility tracking
default_template: meeting/decision-minutes
skeleton_file: guides/skeletons-meeting.md

templates:
  - id: meeting/decision-minutes
    name: Decision Minutes
  - id: meeting/discussion-minutes
    name: Discussion Minutes
  - id: meeting/interview-record
    name: Interview Record
  - id: meeting/one-on-one-note
    name: 1:1 Communication Record
  - id: meeting/workshop-summary
    name: Workshop Summary

selection_rules:
  - condition: "Focus is discussion process and decisions"
    template: meeting/decision-minutes
  - condition: "Focus is research input and Q&A"
    template: meeting/interview-record
  - condition: "Focus is 1:1 communication"
    template: meeting/one-on-one-note
  - condition: "Focus is workshop co-creation"
    template: meeting/workshop-summary
  - condition: "Needs formal archiving (with ACTION numbers/Parking Lot)"
    template: product/meeting-minutes-detailed
    cross_family: true
  - condition: "Uncertain sub-type"
    template: meeting/decision-minutes
