# Learning Family -- Learning, review, knowledge distillation
# Covers: course notes, tutorial playbook, book summaries (nonfiction/fiction), lecture summaries, concept explainers
# Output skeleton: guides/skeletons-learning.md

family: learning
description: Learn, review, knowledge distillation
default_template: learning/course-notes
skeleton_file: guides/skeletons-learning.md

templates:
  - id: learning/course-notes
    name: Course Notes
  - id: learning/tutorial-playbook
    name: Tutorial Playbook
  - id: learning/nonfiction-book-summary
    name: Nonfiction Book Summary
    notes: Default output is 1 full book overview + N chapter files
  - id: learning/fiction-book-summary
    name: Narrative/Fiction Book Summary
    notes: Default output is 1 full book overview + N chapter files
  - id: learning/lecture-summary
    name: Lecture Summary
  - id: learning/concept-explainer
    name: Concept Explainer

selection_rules:
  - condition: "Focus is courses/lectures/bootcamps"
    template: learning/course-notes
  - condition: "Focus is hands-on steps"
    template: learning/tutorial-playbook
  - condition: "Focus is a full nonfiction book"
    template: learning/nonfiction-book-summary
  - condition: "Focus is a novel/narrative work"
    template: learning/fiction-book-summary
  - condition: "Single lecture/talk"
    template: learning/lecture-summary
  - condition: "Explain a concept"
    template: learning/concept-explainer
  - condition: "Uncertain sub-type"
    template: learning/course-notes
