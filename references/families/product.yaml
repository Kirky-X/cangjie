family:
  id: product
  label: 产品文档类
  purpose: "面向产品规划、需求定义、技术设计、交付发布和运营落地的完整文档体系。模板源自实战产品文档库，含详细章节骨架、表格和图示。"

section_library:
  doc_meta: "文档状态、保密级别、版本、日期、撰写人、评审人、阅读对象"
  doc导读: "文档目的与适用范围、相关文档、变更记录"
  executive_summary: "执行摘要，决策者先看"
  background: "项目背景、市场机会、数据支撑、战略对齐"
  objectives: "项目目标，区分商业/用户/效率目标，含衡量指标"
  pain_points: "核心痛点分析，用用户原话描述"
  market_analysis: "市场规模、趋势、TAM/SAM/SOM"
  product_definition: "产品定位、目标用户、产品形态、边界范围"
  user_persona: "用户画像，具象化用户"
  user_journey: "用户旅程地图"
  feature_list: "功能清单，含优先级（MoSCoW）、负责人、依赖项"
  product_architecture: "产品架构图"
  functional_detail: "功能详述：业务流程、页面流转、输入输出、业务规则、状态机、异常处理、时序图、验收标准"
  non_functional: "非功能需求：性能、安全、可用性、兼容性"
  data_tracking: "数据埋点方案"
  release_plan: "发布计划、里程碑、灰度策略、回滚方案"
  risk_register: "风险登记册、外部依赖"
  business_model: "商业模式画布、收入模型、单位经济模型"
  competitive_analysis: "竞争格局、竞品对比、护城河"
  financial_forecast: "财务预测、融资需求、资金用途"
  team: "核心管理团队、顾问团队"
  swot: "SWOT 战略分析"
  literature_method: "研究方法论声明、PRISMA 流程"
  literature_evolution: "研究演进脉络、三阶段时间线"
  literature_comparison: "方案多维度对比分析、评判框架"
  literature_recommendation: "最优方案评判与推荐、场景化推荐"
  literature_gaps: "当前研究瓶颈与突破方向"
  references_section: "参考文献、附录、术语表"

templates:
  - id: product/business-plan
    label: 商业计划书（BP）
    template_file: "templates/【模板】商业计划书.md"
    best_for: [融资路演, 投资人沟通, 商业计划撰写]
    detection_signals: [商业计划书, BP, 融资, 路演, 投资人]
    anti_signals: [会议纪要, 论文总结]
  - id: product/business-model
    label: 商业模式文档
    template_file: "templates/【模板】商业模式文档.md"
    best_for: [商业模式设计, 价值主张梳理, 盈利路径设计]
    detection_signals: [商业模式, 商业模式画布, 盈利模式, 价值主张]
    anti_signals: [会议纪要, 论文总结]
  - id: product/brd
    label: 商业需求文档（BRD）
    template_file: "templates/产品/战略层/【模板】商业需求文档.md"
    best_for: [商业需求定义, 战略层文档, 项目立项]
    detection_signals: [商业需求, BRD, 立项, 战略需求]
    anti_signals: [技术设计, 测试报告]
  - id: product/market-research
    label: 市场调研报告
