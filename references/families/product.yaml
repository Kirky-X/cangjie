# Product Family -- Product documentation, business plans, technical design, delivery and operations
# Covers: full product lifecycle (strategy/product/technical/delivery/operations/retirement) + general docs + standalone templates
# Output templates: ../templates/Product/<layer>/<template>.md
# Index: templates-index.md
# Note: Product family does not use skeletons-*.md; uses full output templates from templates/ directly

family: product
description: Product documentation, business plans, technical design, delivery and operations
default_template: product/prd
templates_index: templates-index.md
templates_dir: ../templates/

# Organized by lifecycle layers
layers:
  Strategy:
    description: "Why -- answers why we should do this"
    templates:
      - id: product/brd
        name: Business Requirements Document (BRD)
      - id: product/mrd
        name: Market Requirements Document (MRD)
      - id: product/market-research
        name: Market Research Report
      - id: product/competitive-analysis
        name: Competitive Analysis Report
      - id: product/charter
        name: Project Charter

  Product:
    description: "What -- answers what we should build"
    templates:
      - id: product/prd
        name: Product Requirements Document (PRD)
      - id: product/frd
        name: Functional Requirements Document (FRD)
      - id: product/uiux-spec
        name: Product Color and UIUX Specification

  Technical:
    description: "How -- answers how to implement"
    templates:
      - id: product/trd
        name: Technical Requirements Document (TRD)
      - id: product/architecture
        name: Architecture Design Document
      - id: product/api-doc
        name: API Documentation
      - id: product/db-design
        name: Database Design Document
      - id: product/algorithm-doc
        name: Core Algorithm Document

  Delivery:
    description: "When -- answers when to launch"
    templates:
      - id: product/release-plan
        name: Release Plan Document
      - id: product/test-report
        name: Test Report
      - id: product/canary-plan
        name: Canary Plan

  Operations:
    description: "Run -- answers how to operate"
    templates:
      - id: product/operation-guide
        name: Operations Manual
      - id: product/dashboard
        name: Data Dashboard
      - id: product/user-guide
        name: User Manual
      - id: product/weekly-monthly-report
        name: Weekly/Monthly Report (Product Family Formal Archival Version)
        notes: Distinguish from business/weekly-monthly-report -- this template is the product family's archival version

  Retirement:
    description: "End -- answers how to wrap up"
    templates:
      - id: product/retrospective
        name: Retrospective Report
      - id: product/knowledge-base
        name: Knowledge Base

  General Docs:
    description: "Cross-lifecycle general engineering documents"
    location: ../templates/General/
    templates:
      - id: product/readme
        name: README
        template_path: ../templates/General/[Template] README.md
      - id: product/changelog
        name: CHANGELOG
        template_path: ../templates/General/[Template] CHANGELOG.md
      - id: product/faq
        name: FAQ
        template_path: ../templates/General/[Template] FAQ.md
      - id: product/contributing
        name: CONTRIBUTING
        template_path: ../templates/General/[Template] CONTRIBUTING.md

  Standalone Templates:
    description: "Not part of product lifecycle but categorized under product family"
    templates:
      - id: product/business-plan
        name: Business Plan (BP)
        template_path: ../templates/[Template] Business Plan.md
      - id: product/business-model
        name: Business Model Document
        template_path: ../templates/[Template] Business Model Document.md
      - id: product/meeting-minutes-detailed
        name: Formal Meeting Minutes
        template_path: ../templates/[Template] Meeting Minutes.md
        notes: Follows FAR principle; distinguish from meeting/decision-minutes
      - id: product/literature-review
        name: Literature Review Report
        template_path: ../templates/[Template] Research Report.md

selection_rules:
  - condition: "Business plan/fundraising pitch"
    template: product/business-plan
  - condition: "Business model/value proposition"
    template: product/business-model
  - condition: "Strategy layer - business requirements/project initiation"
    template: product/brd
  - condition: "Strategy layer - market requirements"
    template: product/mrd
  - condition: "Strategy layer - market research"
    template: product/market-research
  - condition: "Strategy layer - competitive analysis"
    template: product/competitive-analysis
  - condition: "Strategy layer - project charter"
    template: product/charter
  - condition: "Product layer - product requirements"
    template: product/prd
  - condition: "Product layer - functional requirements detail"
    template: product/frd
  - condition: "Product layer - UIUX/color"
    template: product/uiux-spec
  - condition: "Technical layer - technical solution"
    template: product/trd
  - condition: "Technical layer - system architecture"
    template: product/architecture
  - condition: "Technical layer - API/interface"
    template: product/api-doc
  - condition: "Technical layer - database design"
    template: product/db-design
  - condition: "Technical layer - core algorithm"
    template: product/algorithm-doc
  - condition: "Delivery layer - release plan"
    template: product/release-plan
  - condition: "Delivery layer - test report"
    template: product/test-report
  - condition: "Delivery layer - canary plan"
    template: product/canary-plan
  - condition: "Operations layer - operations manual"
    template: product/operation-guide
  - condition: "Operations layer - data dashboard"
    template: product/dashboard
  - condition: "Operations layer - user manual"
    template: product/user-guide
  - condition: "Operations layer - weekly/monthly report (formal archival version)"
    template: product/weekly-monthly-report
  - condition: "Retirement layer - retrospective"
    template: product/retrospective
  - condition: "Retirement layer - knowledge base"
    template: product/knowledge-base
  - condition: "Formal archival minutes (with ACTION numbers)"
    template: product/meeting-minutes-detailed
  - condition: "Literature review report (with PRISMA)"
    template: product/literature-review
  - condition: "Uncertain sub-layer"
    template: product/prd
