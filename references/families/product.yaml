# Product 族 — 产品文档、商业计划、技术设计、交付运营
# 覆盖：产品全生命周期（战略/产品/技术/交付/运营/退役）+ 通用文档 + 独立模板
# 产物模板：../templates/Product/<layer>/<template>.md
# 索引：templates-index.md
# 注意：Product 族不使用 skeletons-*.md，直接使用 templates/ 下的完整产物模板

family: product
description: 产品文档、商业计划、技术设计、交付运营
default_template: product/prd
templates_index: templates-index.md
templates_dir: ../templates/

# 按生命周期分层组织
layers:
  战略层:
    description: "Why — 回答为什么要做"
    templates:
      - id: product/brd
        name: 商业需求文档（BRD）
      - id: product/mrd
        name: 市场需求文档（MRD）
      - id: product/market-research
        name: 市场调研报告
      - id: product/competitive-analysis
        name: 竞品分析报告
      - id: product/charter
        name: 项目任务书（Charter）

  产品层:
    description: "What — 回答做什么"
    templates:
      - id: product/prd
        name: 产品需求文档（PRD）
      - id: product/frd
        name: 功能需求文档（FRD）
      - id: product/uiux-spec
        name: 产品配色与 UIUX 规范

  技术层:
    description: "How — 回答怎么做"
    templates:
      - id: product/trd
        name: 技术需求文档（TRD）
      - id: product/architecture
        name: 架构设计文档
      - id: product/api-doc
        name: API 文档
      - id: product/db-design
        name: 数据库设计文档
      - id: product/algorithm-doc
        name: 核心算法文档

  交付层:
    description: "When — 回答何时上线"
    templates:
      - id: product/release-plan
        name: 发布计划文档
      - id: product/test-report
        name: 测试报告
      - id: product/canary-plan
        name: 灰度方案

  运营层:
    description: "Run — 回答如何运转"
    templates:
      - id: product/operation-guide
        name: 运营手册
      - id: product/dashboard
        name: 数据看板
      - id: product/user-guide
        name: 用户手册
      - id: product/weekly-monthly-report
        name: 周报月报（产品族正式归档版）
        notes: 与 business/weekly-monthly-report 区分——本模板为产品族归档版

  退役层:
    description: "End — 回答如何善终"
    templates:
      - id: product/retrospective
        name: 复盘报告
      - id: product/knowledge-base
        name: 知识沉淀

  通用文档:
    description: "跨生命周期通用工程文档"
    location: ../templates/Common/
    templates:
      - id: product/readme
        name: README
        template_path: ../templates/Common/Template-README.md
      - id: product/changelog
        name: CHANGELOG
        template_path: ../templates/Common/Template-CHANGELOG.md
      - id: product/faq
        name: FAQ
        template_path: ../templates/Common/Template-FAQ.md
      - id: product/contributing
        name: CONTRIBUTING
        template_path: ../templates/Common/Template-CONTRIBUTING.md

  独立模板:
    description: "非产品生命周期但归入 product 族"
    templates:
      - id: product/business-plan
        name: 商业计划书（BP）
        template_path: ../templates/Template-Business-Plan.md
      - id: product/business-model
        name: 商业模式文档
        template_path: ../templates/Template-Business-Model.md
      - id: product/meeting-minutes-detailed
        name: 正式会议纪要
        template_path: ../templates/Template-Meeting-Minutes.md
        notes: 遵循 FAR 原则，与 meeting/decision-minutes 区分
      - id: product/literature-review
        name: 文献综述报告
        template_path: ../templates/Template-Literature-Review.md

selection_rules:
  - condition: "商业计划/融资路演"
    template: product/business-plan
  - condition: "商业模式/价值主张"
    template: product/business-model
  - condition: "战略层 - 商业需求/立项"
    template: product/brd
  - condition: "战略层 - 市场需求"
    template: product/mrd
  - condition: "战略层 - 市场调研"
    template: product/market-research
  - condition: "战略层 - 竞品分析"
    template: product/competitive-analysis
  - condition: "战略层 - 项目任务书"
    template: product/charter
  - condition: "产品层 - 产品需求"
    template: product/prd
  - condition: "产品层 - 功能需求细化"
    template: product/frd
  - condition: "产品层 - UIUX/配色"
    template: product/uiux-spec
  - condition: "技术层 - 技术方案"
    template: product/trd
  - condition: "技术层 - 系统架构"
    template: product/architecture
  - condition: "技术层 - API/接口"
    template: product/api-doc
  - condition: "技术层 - 数据库设计"
    template: product/db-design
  - condition: "技术层 - 核心算法"
    template: product/algorithm-doc
  - condition: "交付层 - 发布计划"
    template: product/release-plan
  - condition: "交付层 - 测试报告"
    template: product/test-report
  - condition: "交付层 - 灰度方案"
    template: product/canary-plan
  - condition: "运营层 - 运营手册"
    template: product/operation-guide
  - condition: "运营层 - 数据看板"
    template: product/dashboard
  - condition: "运营层 - 用户手册"
    template: product/user-guide
  - condition: "运营层 - 周报月报（正式归档版）"
    template: product/weekly-monthly-report
  - condition: "退役层 - 复盘"
    template: product/retrospective
  - condition: "退役层 - 知识沉淀"
    template: product/knowledge-base
  - condition: "正式归档纪要（含 ACTION 编号）"
    template: product/meeting-minutes-detailed
  - condition: "文献综述报告（含 PRISMA）"
    template: product/literature-review
  - condition: "不确定子层"
    template: product/prd
