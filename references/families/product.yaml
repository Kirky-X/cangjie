    detection_signals: [详细会议纪要, 正式纪要, 行动项跟踪, ACTION编号]
    anti_signals: [快速讨论纪要, 头脑风暴]
    note: "比 meeting/decision-minutes 更详细，含 ACTION/RISK 编号体系、Parking Lot、下次会议计划、FAR 原则。需要正式归档时优先使用。"
  - id: product/literature-review
    label: 论文研究报告（综述）
    template_file: "templates/【模板】论文研究报告.md"
    best_for: [文献综述, 系统综述, 研究进展报告, 多论文综合]
    detection_signals: [论文研究报告, 文献综述, 系统综述, 研究进展, PRISMA]
    anti_signals: [单篇论文总结]
    note: "比 analysis/survey-paper-summary 更详细，含 PRISMA 流程、五维评判框架、场景化推荐。面向需要建立评判框架并推荐最优路径的综述报告。"
