# Cangjie Template Registry
# Defines metadata for all templates: family / required_sections / optional_sections / detection_signals / fallback
# Used by SKILL.md workflow Step 4 (auto template matching) and Step 6 (pre-generation confirmation of required_sections)
# Template ID naming convention: <family>/<template-name>, globally unique across families
# required_sections: sections that must be populated during generation; when materials are insufficient, mark as "Materials not provided/Unable to confirm"; do not fabricate
# optional_sections: selectively populated based on material richness
# detection_signals: keyword signals for auto-matching; works in conjunction with taxonomy.yaml signal_words
# fallback: fallback template ID when this template's required_sections cannot be filled

version: 1

