# Cangjie Template Registry
# Defines metadata for all templates: family / required_sections / optional_sections / detection_signals / fallback
# Used in SKILL.md workflow Step 4 (auto template matching) and Step 6 (pre-generation confirmation of required_sections)
# Template ID naming convention: <family>/<template-name>, unique across families
# required_sections: sections that must be filled during generation; when materials are insufficient, mark "materials not provided/cannot confirm", do not force-fill
# optional_sections: selectively filled based on material richness
# detection_signals: keyword signals for auto-matching; works in conjunction with taxonomy.yaml's signal_words
# fallback: fallback template ID when this template cannot fill required_sections

version: 1

