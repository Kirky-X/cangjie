# Cangjie 模板注册表
# 定义所有模板的元数据：family / required_sections / optional_sections / detection_signals / fallback
# 用于 SKILL.md 工作流 Step 4（自动模板匹配）和 Step 6（生成前确认 required_sections）
# 模板 ID 命名规则：<family>/<template-name>，跨族唯一
# required_sections：生成时必须填充的章节；材料不足时标注"材料未提供/无法确认"，禁止硬凑
# optional_sections：视材料丰富度选择性填充
# detection_signals：自动匹配时的关键词信号；与 taxonomy.yaml 的 signal_words 协同
# fallback：当本模板无法填充 required_sections 时的回落模板 ID

version: 1

templates:

  # ============================================================
  # Learning 族（默认回落：learning/course-notes）
  # ============================================================

  learning/course-notes:
    family: learning
    name: 课程笔记
    required_sections:
      - 基本信息
      - 内容概览
      - 模块拆解
      - 关键知识点
      - 复习问题
    optional_sections:
      - 可执行练习
      - 术语表
    detection_signals:
      - 课程
      - 讲座
      - 训练营
      - 教学视频
      - 学习笔记
    fallback: learning/course-notes

  learning/tutorial-playbook:
    family: learning
    name: 教程操作手册
    required_sections:
      - 目标
      - 前置条件
      - 操作步骤
      - 常见坑
      - 下一步
    optional_sections:
      - 参考命令/资源
    detection_signals:
      - 教程
      - 操作步骤
      - playbook
      - 实操
      - 上手
    fallback: learning/course-notes

  learning/nonfiction-book-summary:
    family: learning
    name: 非虚构书籍总结
    required_sections:
      - 基本信息
      - 输出文件
      - 全书总览
      - 核心论点
      - 分部结构总览
      - 分部/章节导航
      - 关键概念/模型
      - 全书结构与论证路径
      - 可执行启发
      - 局限与可疑点
    optional_sections: []
    detection_signals:
      - 商业书
      - 非虚构
      - 方法论
      - 心理学
      - 历史
      - 科普
      - 全书总结
      - 逐章
    fallback: learning/course-notes
    notes: 章节文件额外使用 learning/nonfiction-book-summary#chapter 骨架

  learning/fiction-book-summary:
    family: learning
    name: 叙事/小说书籍总结
    required_sections:
      - 基本信息
      - 输出文件
      - 全书总览
      - 分部结构总览
      - 分部/章节导航
      - 主要人物与关系
      - 情节推进与转折
      - 主题与母题
      - 叙事结构与视角
      - 阅读启发/整体评价
    optional_sections: []
    detection_signals:
      - 小说
      - 文学
      - 叙事
      - 故事
      - 人物
      - 情节
    fallback: learning/course-notes
    notes: 章节文件额外使用 learning/fiction-book-summary#chapter 骨架

