# Cangjie Template Taxonomy
# Defines output goal classifications, used in SKILL.md workflow Step 2 (goal identification)
# Matching rules: scan user input and materials; if signal_words are hit, assign to the corresponding goal;
# When multiple goals are hit, follow SKILL.md "Common Faults - Signal Conflicts" handling (list candidates and ask user)
# When no clear match, fall back to the closest goal.default_family based on context

version: 1

goals:

  learning:
    description: Learn, review, knowledge distillation
    signal_words:
      - learning
      - review
      - notes
      - course
      - lecture
      - tutorial
      - bootcamp
      - teaching video
      - book
      - books
      - reading
      - reading reflection
      - concept
      - understanding
      - learned
      - knowledge point
      - steps
      - playbook
    default_family: learning
    selection_hints:
      - "Goal is learning and review -> learning/*"
      - "Focus is courses/lectures/bootcamps -> learning/course-notes"
      - "Focus is hands-on steps -> learning/tutorial-playbook"
      - "Focus is a full nonfiction book -> learning/nonfiction-book-summary"
      - "Focus is a novel/narrative work -> learning/fiction-book-summary"
      - "Single lecture/talk -> learning/lecture-summary"
      - "Explain a concept -> learning/concept-explainer"

  recap:
    description: Show recap, highlight distribution
    signal_words:
      - recap
      - show
      - podcast
      - video
      - interview show
      - highlights
      - clip
      - livestream
      - content consumption
      - playlist
      - guest
      - host
    default_family: media
    selection_hints:
      - "Goal is content recap and highlight distribution -> media/*"
      - "Podcast/interview audio -> media/podcast-summary"
      - "Video show -> media/video-program-summary"
      - "Livestream recap -> media/livestream-recap"
      - "Distill highlights -> media/content-highlights"

  discussion_record:
    description: Discussion record, responsibility tracking
    signal_words:
      - meeting
      - discussion
      - minutes
      - interview record
      - 1:1
      - 1on1
      - one-on-one
      - workshop
      - co-creation
      - decision
      - action item
      - ACTION
      - owner
    default_family: meeting
    selection_hints:
      - "Focus is discussion process and decisions -> meeting/decision-minutes"
      - "Focus is research input and Q&A -> meeting/interview-record"
      - "Focus is 1:1 communication -> meeting/one-on-one-note"
      - "Focus is workshop co-creation -> meeting/workshop-summary"
      - "Needs formal archiving (with ACTION numbers/Parking Lot) -> product/meeting-minutes-detailed"

  status_reporting:
    description: Status reporting, progress tracking
    signal_words:
      - weekly report
      - monthly report
      - quarterly report
      - report
      - progress
      - status
      - report
      - risk
      - blocker
      - action item
      - priority
      - executive briefing
    default_family: business
    selection_hints:
      - "Focus is milestone progress and metrics -> business/project-status-report"
      - "Focus is weekly/monthly regular sync -> business/weekly-monthly-report"
      - "Focus is upward reporting -> business/executive-brief"
      - "Focus is incident/issues -> business/risk-issue-report"
      - "Focus is action tracking -> business/action-tracker"

  synthesis:
    description: Multi-source synthesis, decision support
    signal_words:
      - synthesis
      - distill
      - theme synthesis
      - competitor scan
      - material synthesis
      - multiple materials
      - decision support
      - decision memo
      - research
      - briefing
    default_family: analysis
    selection_hints:
      - "Focus is common themes -> analysis/theme-synthesis"
      - "Focus is making a choice -> analysis/decision-memo"
      - "Focus is industry and fact scan -> analysis/research-brief"
      - "Lightweight peer comparison -> analysis/competitive-scan"
      - "Product-decision-oriented competitive analysis -> product/competitive-analysis"

  paper_review:
    description: Paper reading, research distillation
    signal_words:
      - paper
      - paper
      - research topic
      - formula
      - experiment
      - theory
      - proof
      - system
      - survey
      - literature
      - dataset
      - metric
      - baseline
      - ablation
    default_family: analysis
    selection_hints:
      - "Goal is reading a single paper -> analysis/paper-summary"
      - "Theorem/proof/formula derivation -> analysis/theoretical-paper-summary"
      - "Dataset/metric/experiment comparison -> analysis/experimental-paper-summary"
      - "System architecture/throughput latency -> analysis/systems-paper-summary"
      - "Literature survey/taxonomy -> analysis/survey-paper-summary"
      - "Literature review building an evaluation framework -> product/literature-review"

  product_documentation:
    description: Product documentation, business plan, technical design
    signal_words:
      - PRD
      - BP
      - TRD
      - BRD
      - MRD
      - Charter
      - project charter
      - business plan
      - business model
      - product requirements
      - functional requirements
      - technical requirements
      - architecture design
      - API documentation
      - database design
      - algorithm
      - market research
      - market requirements
      - competitive analysis
      - literature review
      - release plan
      - test report
      - canary plan
      - operations manual
      - data dashboard
      - user manual
      - weekly monthly report
      - retrospective
      - knowledge base
      - README
      - CHANGELOG
      - FAQ
      - CONTRIBUTING
      - UIUX
      - color specification
    default_family: product
    selection_hints:
      - "Business plan/fundraising pitch -> product/business-plan"
      - "Business model/value proposition -> product/business-model"
      - "Strategy layer (Why) -> product/brd, product/mrd, product/charter, product/market-research, product/competitive-analysis"
      - "Product layer (What) -> product/prd, product/frd, product/uiux-spec"
      - "Technical layer (How) -> product/trd, product/architecture, product/api-doc, product/db-design, product/algorithm-doc"
      - "Delivery layer (When) -> product/release-plan, product/test-report, product/canary-plan"
      - "Operations layer (Run) -> product/operation-guide, product/dashboard, product/user-guide, product/weekly-monthly-report"
      - "Retirement layer (End) -> product/retrospective, product/knowledge-base"
      - "General documentation -> README / CHANGELOG / FAQ / CONTRIBUTING"
      - "Uncertain sub-layer -> product/prd"
